# Apache hardening include for deployments serving this repository in-place.
# Prefer a dedicated public/ document root when possible. If this repo remains
# under /var/www/html, include equivalent rules in the vhost/server config
# because many systems disable .htaccess with AllowOverride None.

<Directory "/var/www/html/ScytaleDroid-Web">
    Options -Indexes -MultiViews +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<DirectoryMatch "^/var/www/html/ScytaleDroid-Web/(\.git|config|database|lib|scripts|deploy|tests|vendor)(/|$)">
    Require all denied
</DirectoryMatch>

# Page partials are include-only templates, not standalone HTTP routes.
<DirectoryMatch "^/var/www/html/ScytaleDroid-Web/pages/_partials(/|$)">
    Require all denied
</DirectoryMatch>

# Deny local configuration, repository metadata, and operator-only files even
# if the repository is served in place instead of through a public document root.
<FilesMatch "^(\.|AGENTS\.md|CONTRIBUTING\.md|README\.md|SECURITY\.md|LICENSE|setup\.sh|composer\.(json|lock)|phpunit\.xml(\.dist)?)$">
    Require all denied
</FilesMatch>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), fullscreen=(self)"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" "expr=%{HTTPS} == 'on'"
</IfModule>
