# Localhost-only staging template. Install only after the /srv release tree,
# dedicated PHP-FPM pool, SELECT-only database identity, and SELinux labels are
# separately reviewed. This file does not add an Apache Listen directive.
<VirtualHost 127.0.0.1:80>
    ServerName scytaledroid-web.localhost
    DocumentRoot "/srv/scytaledroid-web/current"

    <Directory "/srv/scytaledroid-web/current">
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require local
    </Directory>

    # The PHP app lives in one release tree; only controllers and assets are
    # HTTP entry points. Includes, SQL, secrets, and operator files are denied.
    <DirectoryMatch "^/srv/scytaledroid-web/current/(\.git|config|database|lib|scripts|deploy|tests|vendor)(/|$)">
        Require all denied
    </DirectoryMatch>
    <DirectoryMatch "^/srv/scytaledroid-web/current/pages/_partials(/|$)">
        Require all denied
    </DirectoryMatch>
    # URL-space denial also covers a release tree reached through the current
    # symlink, regardless of the filesystem path Apache resolves internally.
    <LocationMatch "^/(\.git|config|database|lib|scripts|deploy|tests|vendor)(/|$)">
        Require all denied
    </LocationMatch>
    <LocationMatch "^/pages/_partials(/|$)">
        Require all denied
    </LocationMatch>
    <FilesMatch "^(\.|AGENTS\.md|CONTRIBUTING\.md|README\.md|SECURITY\.md|LICENSE|setup\.sh|composer\.(json|lock)|phpunit\.xml(\.dist)?)$">
        Require all denied
    </FilesMatch>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "same-origin"
        Header always set Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), fullscreen=(self)"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" "expr=%{HTTPS} == 'on'"
    </IfModule>
</VirtualHost>
